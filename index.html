<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d9488"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Kazuya AI — AI Pembantu untuk Mahasiswa</title>
<style>
:root{--bg:#f4f7f7;--card:#fff;--tx:#14201f;--mut:#5d6f6d;--pri:#0d9488;--pri2:#0f766e;--bd:#dbe5e4;--red:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a1a;--card:#212727;--tx:#eef4f3;--mut:#9db0ae;--bd:#324040}}
:root[data-theme="dark"]{--bg:#161a1a;--card:#212727;--tx:#eef4f3;--mut:#9db0ae;--bd:#324040}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:230px;padding:16px 12px;border-right:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.brand img{width:44px;height:44px;border-radius:12px;background:#000;object-fit:cover}
.brand b{display:block;line-height:1.1}.brand small{color:var(--mut);font-size:11px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;transition:background .2s,transform .2s}
.nav:hover{background:var(--bg);transform:translateX(2px)}.nav.on{background:var(--pri);color:#fff}
.main{flex:1;min-width:0;padding:20px;max-width:960px;margin:0 auto;width:100%}
.view{animation:in .35s ease both}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:20px 0 10px}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
.tile{cursor:pointer;text-align:center;transition:transform .2s,border-color .2s;border:1px solid var(--bd);background:var(--card);border-radius:16px;padding:16px 8px}
.tile:hover{transform:translateY(-3px);border-color:var(--pri)}.tile span{display:block;font-size:26px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover{background:var(--pri2)}.btn:active{transform:scale(.97)}.btn.ghost{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--red)}.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
.hero{background:linear-gradient(135deg,#0d9488,#115e59);color:#fff;border-radius:20px;padding:20px;display:flex;gap:14px;align-items:center}
.hero img{width:72px;height:72px;border-radius:18px;background:#000;animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-5px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:260px;margin:10px 0}.m{max-width:85%;padding:10px 14px;border-radius:16px;animation:in .25s both;white-space:pre-wrap}
.m.u{align-self:flex-end;background:var(--pri);color:#fff}.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--bd)}
.row{display:flex;gap:8px;align-items:center}.row>*{margin-top:0;margin-bottom:0}
.cover{background:#fff;color:#000;border:1px solid #bbb;border-radius:6px;padding:22px 14px;text-align:center;font:13px/1.6 "Times New Roman",serif;min-height:360px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;background:var(--pri);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bottom{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50}.modal.on{display:flex}
.box{background:var(--bg);width:90vw;height:90vh;border-radius:20px;overflow:auto;padding:18px;animation:pop .25s ease both}@keyframes pop{from{opacity:0;transform:scale(.96)}}
.small{width:min(420px,92vw);height:auto;max-height:90vh}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;animation:in .25s both}
footer{text-align:center;color:var(--mut);font-size:12px;margin:30px 0 10px}
@media (max-width:760px){.side{display:none}.main{padding:14px 14px 90px}
.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mut);cursor:pointer;gap:2px}.bottom button.on{color:var(--pri)}
.bottom .plus{background:var(--pri);color:#fff;width:50px;height:50px;border-radius:50%;font-size:26px;margin-top:-22px;justify-content:center}.box{width:100vw;height:100vh;border-radius:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <aside class="side" id="side"></aside>
 <main class="main"><div id="v" class="view"></div><footer>Kazuya AI · Dibuat oleh KazuyaPiniko</footer></main>
</div>
<nav class="bottom" id="bn"></nav>
<div class="modal" id="m"><div class="box" id="mb"></div></div>

 <img src="${LOGO}" alt="Kazuya AI" style="width:150px;border-radius:24px;background:#000">
 <h1>Selamat datang di Kazuya AI</h1><p class="mut">Teman belajar digital untuk membantu mahasiswa menjadi lebih produktif.</p>
 <div style="text-align:left"><label>Email Google (simulasi)</label><input id="em" type="email" placeholder="nama@unesa.ac.id"></div>
 <button class="btn" style="width:100%" onclick="login()">Lanjutkan dengan Google</button>
 <p class="mut" style="font-size:12px">Mode prototipe: login belum terhubung ke Google OAuth sungguhan.</p></div>`;
}
function login(){
 const e=$("#em").value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return toast("Masukkan email yang valid");
 S.user={email:e,name:e.split("@")[0].replace(/[._]/g," "),nim:"",univ:"",prodi:""};
 const u=S.unis.find(x=>e.endsWith(x.domain.toLowerCase()));
 if(u&&!S.premiumUntil){addDays(7);toast("🎓 Selamat! Akun mahasiswa "+u.name+" mendapat Premium gratis 7 hari.")}
 isAdmin=e===ADMIN;save();view="home";render();
}

function home(){
 const n=esc(S.user.name);
 return `<div class="hero"><img src="${LOGO}" alt=""><div><h1>Selamat datang 👋 ${n}</h1><div>Apa yang ingin kamu kerjakan hari ini?</div>
 ${days()?`<span class="pill" style="background:#fff;color:#0f766e;margin-top:8px">🎓 Premium Student Trial · ${days()} hari tersisa</span>`:""}</div></div>
 <h2>Mulai mengerjakan</h2><div class="grid">${TYPES.slice(0,8).map(t=>tile(t)).join("")}</div>
 <p><button class="btn ghost" onclick="go('create')">Lihat Semua</button></p>
 <h2>Tugas terakhir</h2>${S.projects.length?S.projects.slice(-3).reverse().map(p=>`<div class="card item"><span>${p.icon} ${esc(p.title)}</span><span class="mut">${p.status}</span></div>`).join(""):empty()}`;
}
const tile=t=>`<button class="tile" onclick="pick('${t[1]}','${t[0]}')"><span>${t[0]}</span>${t[1]}</button>`;
const empty=()=>`<div class="card" style="text-align:center"><b>Belum ada tugas</b><p class="mut">Yuk mulai membuat tugas pertamamu.</p><button class="btn" onclick="go('create')">+ Buat Tugas</button></div>`;
function pick(t,i){draft={type:t,icon:i};view="create";render()}

function create(){
 if(!draft.type)return `<h1>Apa yang ingin kamu buat?</h1><p class="mut">Kamu sedang mengerjakan apa?</p><div class="grid">${TYPES.map(tile).join("")}</div>`;
 const mk=draft.type=="Makalah",f=(k,l,p="")=>`<label>${l}</label><input value="${esc(draft[k]||"")}" placeholder="${p}" oninput="draft.${k}=this.value;${mk?"cov()":""}">`;
 return `<button class="btn ghost sm" onclick="go('create')">← Kembali</button><h1>${draft.icon} ${draft.type}</h1>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px"><div class="card">
 ${f("title","Judul / topik")}${f("course","Mata kuliah")}${f("lect","Dosen pengampu")}
 ${mk?f("name","Nama lengkap")+f("nim","NIM")+f("prodi","Program studi")+f("fak","Fakultas")+f("univ","Universitas"):""}
 <label>Instruksi dosen (contoh: minimal 10 halaman, APA 7, TNR 12, spasi 1,5)</label><textarea rows="3" oninput="draft.ins=this.value;req()">${esc(draft.ins||"")}</textarea>
 <div id="rq"></div>
 <div class="chips">${MODES.map((m,i)=>`<span class="chip ${S.mode==i?"on":""}" onclick="S.mode=${i};save();render()">${m}</span>`).join("")}</div>
 <button class="btn" onclick="saveProj()">Simpan sebagai proyek</button></div>
 ${mk?`<div><label>Live preview cover</label><div class="cover" id="cv"></div><div class="row" style="margin-top:8px"><input type="file" accept="image/png,image/jpeg,image/webp" onchange="logoUp(this)"></div></div>`:""}</div>`;
}
function req(){const t=(draft.ins||"").toLowerCase(),r=[];
 const pg=t.match(/minimal\s+(\d+)\s+halaman/);if(pg)r.push("Minimal "+pg[1]+" halaman");
 const ci=t.match(/apa 7|mla|chicago|ieee|vancouver/);if(ci)r.push(ci[0].toUpperCase());
 const fo=t.match(/(times new roman|arial|calibri)\s*(\d+)?/);if(fo)r.push(fo[0]);
 const sp=t.match(/spasi\s*([\d,.]+)/);if(sp)r.push("Spasi "+sp[1]);
 const e=$("#rq");if(e)e.innerHTML=r.length?`<div class="card" style="margin-bottom:10px"><b>Requirement Checklist</b><br>${r.map(x=>"✓ "+esc(x)).join("<br>")}</div>`:""}
function cov(){const d=draft,e=$("#cv");if(!e)return;
 e.innerHTML=`<b style="font-size:16px">MAKALAH</b><br><br><b>${esc(d.title||"[JUDUL MAKALAH]")}</b><br><br>Disusun untuk memenuhi tugas mata kuliah<br><b>${esc(d.course||"[NAMA MATA KULIAH]")}</b><br>Dosen Pengampu:<br>${esc(d.lect||"[NAMA DOSEN]")}<br><br>${d.logo?`<img src="${d.logo}" style="height:80px;max-width:100%">`:"[AREA LOGO UNIVERSITAS]"}<br><br>Disusun oleh:<br><b>${esc(d.name||"[NAMA LENGKAP]")}</b><br>${esc(d.nim||"[NIM]")}<br>${esc(d.prodi||"[PROGRAM STUDI]")}<br>${esc(d.fak||"[FAKULTAS]")}<br><b>${esc(d.univ||"[UNIVERSITAS]")}</b><br>${new Date().getFullYear()}`}
function logoUp(i){const f=i.files[0];if(!f)return;if(f.size>1.5e6)return toast("Logo maksimal 1,5 MB");const r=new FileReader();r.onload=()=>{draft.logo=r.result;cov()};r.readAsDataURL(f)}
function saveProj(){if(!draft.title)return toast("Isi judul / topik dulu");
 const p={...draft,status:"🟡 Sedang dikerjakan",id:Date.now()};if(p.logo&&p.logo.length>3e5)delete p.logo;
 S.projects.push(p);save();toast("✓ Proyek tersimpan");go("projects")}

function projects(){return `<h1>📁 Proyek</h1>`+(S.projects.length?S.projects.slice().reverse().map(p=>`<div class="card item" style="margin-bottom:8px"><div><b>${p.icon} ${esc(p.title)}</b><br><span class="mut">${p.type} · ${esc(p.course||"")}</span></div>
 <div class="row"><button class="btn ghost sm" onclick="st(${p.id})">${p.status}</button><button class="btn ghost sm" onclick="del(${p.id})">🗑</button></div></div>`).join(""):empty())}
function st(id){const o=["🔴 Belum mulai","🟡 Sedang dikerjakan","🟢 Selesai"],p=S.projects.find(x=>x.id==id);p.status=o[(o.indexOf(p.status)+1)%3];save();render()}
function del(id){S.projects=S.projects.filter(x=>x.id!=id);save();render()}

function chat(){return `<h1>🤖 AI Chat</h1><div class="chips">${MODES.map((m,i)=>`<span class="chip ${S.mode==i?"on":""}" onclick="S.mode=${i};save();render()">${m}</span>`).join("")}</div>
 <div class="mut" style="font-size:13px">Gaya: <select style="width:auto;padding:4px 8px;margin:0" onchange="S.style=this.value;save()">${STYLES.map((s,i)=>`<option value="${i}" ${S.style==i?"selected":""}>${s}</option>`).join("")}</select> · Kredit ${S.credit-S.used}/${S.credit}</div>
 <div class="msgs" id="ms">${S.chat.length?S.chat.map(m=>`<div class="m ${m.r}">${esc(m.t)}</div>`).join(""):`<div class="mut">Tanyakan apa saja: tugas, materi, rangkuman, ide tulisan.</div>`}</div>
 <div class="row"><input id="ci" placeholder="Tulis pesan..." onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">Kirim</button></div>`}
const scrollChat=()=>window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
function send(){const i=$("#ci"),t=i.value.trim();if(!t)return;
 if(S.credit-S.used<5)return toast("Kredit habis. Gunakan Redeem Code di Profil.");
 S.chat.push({r:"u",t});S.used+=5;save();render();
 const ms=$("#ms");ms.insertAdjacentHTML("beforeend",`<div class="m a" id="ld">AI sedang menganalisis...</div>`);scrollChat();
 setTimeout(()=>{S.chat.push({r:"a",t:`(Demo) Pesanmu: "${t}"\nMode: ${MODES[S.mode]} · Gaya: ${STYLES[S.style]}.\nJawaban AI sungguhan akan muncul setelah backend dan API key terpasang di server.`});save();render()},900)}

function profile(){const u=S.user;return `<h1>👤 Profil</h1><div class="card"><b>${esc(u.name)}</b> ${days()?`<span class="pill">⭐ PREMIUM</span>`:`<span class="pill" style="background:#64748b">FREE</span>`}<br><span class="mut">${esc(u.email)}</span>
 <p>${days()?`Premium aktif sampai ${new Date(S.premiumUntil).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}`:"Paket FREE"}<br>AI Credit: ${S.credit-S.used} / ${S.credit}</p>
 <label>NIM</label><input value="${esc(u.nim)}" oninput="S.user.nim=this.value;save()"><label>Universitas</label><input value="${esc(u.univ)}" oninput="S.user.univ=this.value;save()"><label>Program studi</label><input value="${esc(u.prodi)}" oninput="S.user.prodi=this.value;save()"></div>
 <h2>🎁 Redeem Code</h2><div class="card row"><input id="rc" placeholder="MASUKKAN KODE REDEEM"><button class="btn" onclick="redeem()">Gunakan Kode</button></div>
 <h2>Tampilan</h2><div class="chips">${[["System",null],["Light",false],["Dark",true]].map(x=>`<span class="chip ${S.dark===x[1]?"on":""}" onclick="S.dark=${x[1]};save();theme();render()">${x[0]}</span>`).join("")}</div>
 <h2>Akun</h2><div class="row">${isAdmin?`<button class="btn" onclick="admin()">🛡️ Admin Panel</button>`:`<button class="btn ghost" onclick="denied()">Admin</button>`}<button class="btn ghost" onclick="S.user=null;isAdmin=false;save();render()">Logout</button></div>`}
function redeem(){const c=$("#rc").value.trim().toUpperCase(),k=S.codes.find(x=>x.code==c&&x.on&&x.used<x.limit&&(!x.exp||Date.parse(x.exp)>=Date.now()));
 if(!k)return toast("✕ Kode tidak valid atau sudah digunakan.");k.used++;addDays(k.days);toast("✓ Premium berhasil diaktifkan");render()}
function denied(){toast("Access Denied: bukan akun Super Admin")}

/* Admin popup (prototipe: cek akses sungguhan harus di server) */
let tab="dash";
const TABS=[["dash","📊","Dashboard"],["users","👥","Users"],["redeem","🎁","Redeem Code"],["uni","🏫","Universities"]];
function admin(){if(!isAdmin)return denied();$("#m").classList.add("on");adm()}
function closeM(){$("#m").classList.remove("on")}
function adm(){$("#mb").innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><b>Kazuya AI — Admin Control</b><br><span class="mut">🟢 Super Admin · ${ADMIN}</span></div><button class="btn ghost" onclick="closeM()">× Tutup</button></div>
 <div class="tabs">${TABS.map(t=>`<span class="chip ${tab==t[0]?"on":""}" onclick="tab='${t[0]}';adm()">${t[1]} ${t[2]}</span>`).join("")}</div>${admTab()}`}
function admTab(){
 if(tab=="dash")return `<div class="grid">${[["Total Users",1],["Premium Users",days()?1:0],["Total Projects",S.projects.length],["AI Requests",S.chat.filter(m=>m.r=="u").length],["Credits Used",S.used],["Kode Redeem",S.codes.length]].map(c=>`<div class="card"><div class="mut">${c[0]}</div><h1>${c[1]}</h1></div>`).join("")}</div><p class="mut">Angka berasal dari data lokal prototipe ini.</p>`;
 if(tab=="users")return `<div class="card item"><div><b>${esc(S.user.name)}</b><br><span class="mut">${esc(S.user.email)} · ${days()?"PREMIUM":"FREE"}</span></div><div class="row"><button class="btn sm" onclick="addDays(30);toast('Premium 30 hari diberikan');adm()">Give Premium</button><button class="btn ghost sm" onclick="S.credit+=500;save();toast('+500 kredit');adm()">+500 Kredit</button><button class="btn red sm" onclick="S.premiumUntil=0;save();adm()">Cabut</button></div></div>`;
 if(tab=="redeem")return `<div class="card"><div class="row"><input id="rcode" placeholder="KAZUYA-FREE-7D"><select id="rd" style="width:110px"><option value="7">7 hari</option><option value="30">30 hari</option><option value="90">90 hari</option><option value="365">1 tahun</option></select><input id="rl" type="number" value="100" style="width:90px"></div><div class="row"><input id="rx" type="date"><button class="btn" onclick="mkCode()">Create</button></div></div>
 <div class="card" style="margin-top:10px">${S.codes.map((c,i)=>`<div class="item"><span><b>${esc(c.code)}</b> · ${c.days}h · ${c.used}/${c.limit} ${c.on?"":"· nonaktif"}</span><span class="row"><button class="btn ghost sm" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(c.code)}');toast('Disalin')">Copy</button><button class="btn ghost sm" onclick="S.codes[${i}].on=!S.codes[${i}].on;save();adm()">${c.on?"Disable":"Enable"}</button><button class="btn red sm" onclick="S.codes.splice(${i},1);save();adm()">Delete</button></span></div>`).join("")}</div>`;
 return `<div class="card"><div class="row"><input id="un" placeholder="Nama universitas"><input id="ud" placeholder="@unesa.ac.id"><button class="btn" onclick="mkUni()">Save</button></div></div><div class="card" style="margin-top:10px">${S.unis.map((u,i)=>`<div class="item"><span><b>${esc(u.name)}</b> · ${esc(u.domain)}</span><button class="btn red sm" onclick="S.unis.splice(${i},1);save();adm()">Hapus</button></div>`).join("")}</div>`}
function mkCode(){const c=$("#rcode").value.trim().toUpperCase();if(!c)return toast("Isi kode dulu");if(S.codes.some(x=>x.code==c))return toast("Kode sudah ada");
 S.codes.push({code:c,days:+$("#rd").value,limit:+$("#rl").value||1,used:0,on:true,exp:$("#rx").value});save();toast("✓ Kode dibuat");adm()}
function mkUni(){const n=$("#un").value.trim();let d=$("#ud").value.trim().toLowerCase();if(!n||!d)return toast("Isi nama dan domain");if(d[0]!="@")d="@"+d;S.unis.push({name:n,domain:d});save();toast("✓ Universitas tersimpan");adm()}
$("#m").addEventListener("click",e=>{if(e.target.id=="m")closeM()});
theme();render();
if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
let dip;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;const b=document.createElement("button");b.className="btn";b.textContent="⬇ Install Kazuya AI";b.style.cssText="position:fixed;right:14px;top:14px;z-index:30";b.onclick=()=>{dip.prompt();b.remove()};document.body.append(b)});
</script>
</body>
</html>
